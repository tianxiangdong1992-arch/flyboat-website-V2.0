<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Flyboat Electronic LLC</title>
<meta name="robots" content="noindex">
<script>
(function () {
  // Legacy-path rescue: old flyboat365.com links land here with their old
  // paths preserved (e.g. /contact.asp, /cn/). Send known legacy paths to
  // their counterparts on this site; show the 404 message for the rest.
  var path = location.pathname.replace(/\/{2,}/g, "/").toLowerCase();
  var trimmed = path.replace(/\/+$/, "");
  var target = null;

  var pageMap = {
    "contact": "/contact.html",
    "about": "/about.html",
    "aboutus": "/about.html",
    "products": "/products.html",
    "product": "/products.html",
    "news": "/news.html",
    "certifications": "/certifications.html",
    "certification": "/certifications.html",
    "faq": "/faq.html",
    "blog": "/blog.html",
    "index": "/",
    "default": "/",
    "home": "/"
  };

  if (trimmed === "/cn" || trimmed.indexOf("/cn/") === 0 ||
      trimmed === "/en" || trimmed.indexOf("/en/") === 0) {
    target = "/";
  } else {
    var base = trimmed.substring(trimmed.lastIndexOf("/") + 1);
    var stem = base.replace(/\.(asp|aspx|htm|html|php)$/, "");
    if (Object.prototype.hasOwnProperty.call(pageMap, stem) && stem !== base) {
      target = pageMap[stem];
    } else if (/\.(asp|aspx)$/.test(base)) {
      target = "/"; // any other legacy script page -> home
    } else if (base.indexOf(".") === -1 &&
               Object.prototype.hasOwnProperty.call(pageMap, base)) {
      target = pageMap[base]; // extensionless, e.g. /contact
    }
  }

  if (target) {
    location.replace(target);
  }
})();
</script>
